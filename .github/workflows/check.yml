name: check

on:
  pull_request:
    paths: ["plugins/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Check changed entries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -f
          ids=$(git diff --name-only --diff-filter=AMR "$BASE_SHA" HEAD -- plugins/ | sed -n 's#^plugins/\(.*\)\.toml$#\1#p')
          echo "changed: ${ids:-none}"
          # No added or changed entry (a removal-only PR): check every remaining entry.
          bun run check $ids
